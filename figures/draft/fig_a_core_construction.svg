<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1830 1392" font-family="Helvetica, Arial, sans-serif">
  <!-- ================================================================
       Fig. A — Core-set construction: 13 textbook PDFs -> 436 core problems
       Scale: 10 px = 1 mm (183 mm double column).
       Grammar: white card = artifact (noun) · tinted capsule/box = process
       (action) · diamond = decision · hexagon = human expert check ·
       solid pill = released artifact. (Discard criteria live in the text:
       they are the negation of the candidate criteria shown.)
       Copy rule: labels carry only load-bearing facts for THIS figure
       (provenance + independent verification); grading mechanics
       (5% tolerance, per-sub-answer) live in the text, not here.
       Phase II is a symmetric fork-join, both routes ending "all three
       must agree" and joining in the human check.
       Palette: single blue #2a78d6 on white (roles carried by shape).
       ================================================================ -->
  <defs>
    <marker id="ah" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <!-- robot glyph (44x52); model identity via the `color` attribute on <use> -->
    <g id="bot">
      <circle cx="22" cy="4" r="3" fill="#4b5563"/>
      <line x1="22" y1="7" x2="22" y2="13" stroke="#4b5563" stroke-width="2"/>
      <rect x="4" y="13" width="36" height="26" rx="7" fill="currentColor"/>
      <circle cx="15" cy="26" r="4.5" fill="#ffffff"/>
      <circle cx="29" cy="26" r="4.5" fill="#ffffff"/>
      <circle cx="15" cy="26" r="2" fill="#1f2937"/>
      <circle cx="29" cy="26" r="2" fill="#1f2937"/>
      <rect x="16" y="33" width="12" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
      <rect x="11" y="42" width="22" height="10" rx="3" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1830" height="1392" fill="#ffffff"/>

  <!-- ===================== header ===================== -->
  <text x="48" y="80" font-size="44" font-weight="bold" fill="#111827">a</text>
  <text x="105" y="78" font-size="30" font-weight="bold" fill="#111827">Construction of the 436-problem core set</text>

  <!-- shape legend (top right) -->
  <g font-size="19" fill="#374151">
    <rect x="944" y="52" width="38" height="26" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2.2"/>
    <text x="992" y="71">artifact</text>
    <rect x="1084" y="52" width="38" height="26" rx="13" fill="#eef4fc" stroke="#2a78d6" stroke-width="2"/>
    <text x="1132" y="71">process</text>
    <path d="M1248,52 L1270,65 L1248,78 L1226,65 Z" fill="#ffffff" stroke="#2a78d6" stroke-width="2.2"/>
    <text x="1280" y="71">decision</text>
    <path d="M1390,52 L1420,52 L1430,65 L1420,78 L1390,78 L1380,65 Z" fill="#faf9f7" stroke="#57534e" stroke-width="2.2"/>
    <text x="1440" y="71">expert step</text>
    <rect x="1636" y="52" width="46" height="26" rx="13" fill="#2a78d6"/>
    <text x="1692" y="71">released</text>
  </g>

  <!-- ===================== phase bands ===================== -->
  <rect x="40" y="104" width="1750" height="374" rx="10" fill="#f6f8fb"/>
  <rect x="40" y="492" width="1750" height="474" rx="10" fill="#f6f8fb"/>
  <rect x="40" y="980" width="1750" height="380" rx="10" fill="#f6f8fb"/>
  <g font-size="21" font-weight="bold" fill="#64748b" letter-spacing="2">
    <text x="100" y="136">PHASE I &#183; Source curation</text>
    <text x="100" y="524">PHASE II &#183; Solver synthesis and answer verification</text>
    <text x="100" y="1012">PHASE III &#183; Quality control and release</text>
  </g>

  <!-- ===================== PHASE I (left -> right) ===================== -->

  <!-- artifact: 13 textbook PDFs -->
  <rect x="55" y="247" width="190" height="160" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <g stroke="#2a78d6" stroke-width="1.8" fill="#ffffff">
    <rect x="134" y="266" width="48" height="60" rx="4"/>
    <rect x="126" y="273" width="48" height="60" rx="4"/>
    <rect x="118" y="280" width="48" height="60" rx="4"/>
  </g>
  <text x="142" y="317" font-size="13" font-weight="bold" fill="#2a78d6" text-anchor="middle">PDF</text>
  <text x="150" y="378" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">13 textbook PDFs</text>

  <!-- arrow + process capsule: OCR -->
  <line x1="245" y1="327" x2="471" y2="327" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="261" y="295" width="200" height="64" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="361" y="321" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Digitize with OCR</text>
  <text x="361" y="345" font-size="16" fill="#3f3f46" text-anchor="middle">preserves formulas &amp; tables</text>

  <!-- artifact: structured Markdown -->
  <rect x="477" y="247" width="180" height="160" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <path d="M542,266 a4,4 0 0 1 4,-4 h30 l16,16 v46 a4,4 0 0 1 -4,4 h-42 a4,4 0 0 1 -4,-4 z" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
  <path d="M576,262 v12 a4,4 0 0 0 4,4 h12" fill="none" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="553" y="298" font-size="18" font-weight="bold" fill="#2a78d6">M</text>
  <path d="M576,286 v14 M571,295 l5,6 l5,-6" fill="none" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="567" y="356" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Structured</text>
  <text x="567" y="381" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Markdown</text>

  <!-- arrow + process capsule: extraction -->
  <line x1="657" y1="327" x2="883" y2="327" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="673" y="295" width="200" height="64" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="756" y="321" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Extract exercises</text>
  <g transform="translate(838,302) scale(0.42)" color="#7cb26a"><use href="#bot"/></g>
  <text x="773" y="345" font-size="16" fill="#3f3f46" text-anchor="middle">every page, end to end</text>

  <!-- artifact: extracted exercises -->
  <rect x="889" y="247" width="240" height="160" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="1009" y="311" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Extracted exercises</text>
  <text x="1009" y="347" font-size="19" fill="#3f3f46" text-anchor="middle">verbatim, source recorded</text>

  <!-- arrow + process capsule: quality screen -->
  <line x1="1129" y1="327" x2="1389" y2="327" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1128" y="295" width="228" height="64" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.8"/>
  <text x="1230" y="333" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Screen for eligibility</text>
  <g transform="translate(1320,314) scale(0.42)" color="#5b9bd5"><use href="#bot"/></g>

  <!-- artifact: candidate problems (carries the example problem the solver below solves) -->
  <rect x="1395" y="247" width="350" height="214" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="1413" y="284" font-size="20" font-weight="bold" fill="#111827">Candidate problems</text>
  <text x="1413" y="310" font-size="19" fill="#3f3f46">solvable from the text alone,</text>
  <text x="1413" y="333" font-size="19" fill="#3f3f46">asks for a number</text>
  <!-- example problem inset (italic) — pairs with the solve() inset below -->
  <rect x="1411" y="346" width="318" height="104" rx="7" fill="#f3f5f8" stroke="#d7dde6" stroke-width="1"/>
  <g font-size="16" font-style="italic" fill="#4b5563">
    <text x="1425" y="370">Calculate Earth&#8217;s equivalent</text>
    <text x="1425" y="393">blackbody temperature at radiative</text>
    <text x="1425" y="416">equilibrium, given albedo A = 0.30</text>
    <text x="1425" y="439">and solar flux F<tspan font-size="12" dy="4">s</tspan><tspan dy="-4"> = 1368 W/m&#178;.</tspan></text>
  </g>

  <!-- ===================== PHASE II (symmetric fork-join) ===================== -->

  <!-- connector + process capsule: blind synthesis -->
  <line x1="1570" y1="461" x2="1570" y2="652" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>

  <!-- decision first: the route is a property of the source book -->
  <path d="M1570,656 L1715,740 L1570,824 L1425,740 Z" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="1570" y="733" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Does the textbook</text>
  <text x="1570" y="758" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">provide an answer?</text>

  <!-- symmetric fork -->
  <path d="M1425,740 L1340,740 L1340,638 L1296,638" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1352" y="680" font-size="19" font-weight="bold" fill="#52525b">yes</text>
  <path d="M1425,740 L1340,740 L1340,842 L1296,842" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1352" y="812" font-size="19" font-weight="bold" fill="#52525b">no</text>

  <!-- process: verify against the textbook (three-way, robot panel) -->
  <rect x="810" y="545" width="480" height="185" rx="12" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="832" y="578" font-size="22" font-weight="bold" fill="#111827">Verify against the textbook</text>
  <use href="#bot" x="888" y="594" color="#5b9bd5"/>
  <use href="#bot" x="1028" y="594" color="#7cb26a"/>
  <use href="#bot" x="1168" y="594" color="#a884d8"/>
  <text x="980" y="627" font-size="22" font-weight="bold" fill="#6b7280" text-anchor="middle">+</text>
  <text x="1120" y="627" font-size="22" font-weight="bold" fill="#6b7280" text-anchor="middle">+</text>
  <g font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="910" y="676">Claude Opus 4.8</text>
    <text x="1050" y="676">GPT-5.5</text>
    <text x="1190" y="676">Gemini 3.1 Pro</text>
  </g>
  <text x="1050" y="716" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">all three must match the textbook answer</text>

  <!-- process: verify across models (three-way, robot panel) -->
  <rect x="810" y="750" width="480" height="185" rx="12" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="832" y="783" font-size="22" font-weight="bold" fill="#111827">Verify across models</text>
  <use href="#bot" x="888" y="799" color="#5b9bd5"/>
  <use href="#bot" x="1028" y="799" color="#7cb26a"/>
  <use href="#bot" x="1168" y="799" color="#a884d8"/>
  <text x="980" y="832" font-size="22" font-weight="bold" fill="#6b7280" text-anchor="middle">+</text>
  <text x="1120" y="832" font-size="22" font-weight="bold" fill="#6b7280" text-anchor="middle">+</text>
  <g font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="910" y="881">Claude Opus 4.8</text>
    <text x="1050" y="881">GPT-5.5</text>
    <text x="1190" y="881">Gemini 3.1 Pro</text>
  </g>
  <text x="1050" y="921" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">all three must agree with each other</text>

  <!-- symmetric join into the expert check -->
  <path d="M810,638 L788,638 L788,740 L764,740" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M810,842 L788,842 L788,740" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- expert verification of ground truth (hexagon) -->
  <path d="M546,665 L734,665 L760,740 L734,815 L546,815 L520,740 Z" fill="#faf9f7" stroke="#57534e" stroke-width="2.5"/>
  <g stroke="#57534e" stroke-width="2" fill="none">
    <circle cx="640" cy="693" r="7"/>
    <path d="M627,714 a13,11 0 0 1 26,0"/>
  </g>
  <text x="640" y="735" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Expert verification</text>
  <text x="640" y="759" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">of ground truth</text>
  <text x="640" y="785" font-size="18" fill="#3f3f46" text-anchor="middle">re-checked by hand</text>

  <!-- arrow expert check -> certified solver -->
  <line x1="520" y1="740" x2="474" y2="740" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>

  <!-- artifact: the certified reference solver — the output of Phase II -->
  <rect x="50" y="615" width="420" height="250" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="72" y="649" font-size="22" font-weight="bold" fill="#111827">Certified reference solver</text>
  <rect x="66" y="663" width="388" height="122" rx="7" fill="#f3f5f8" stroke="#d7dde6" stroke-width="1"/>
  <g font-family="'Courier New', Courier, monospace" font-size="16" fill="#1f2937" xml:space="preserve">
    <text x="80" y="688"><tspan fill="#2a78d6">def</tspan> solve(A=0.30, F_s=1368):</text>
    <text x="80" y="711">    sigma = 5.67e-8  <tspan fill="#7a8699"># frozen constant</tspan></text>
    <text x="80" y="734">    T = ((1-A)*F_s/(4*sigma))**0.25</text>
    <text x="80" y="757">    <tspan fill="#2a78d6">return</tspan> {"1": {"value": T, "unit": "K"}}</text>
  </g>
  <text x="72" y="817" font-size="18"><tspan fill="#3f3f46">returns </tspan><tspan font-weight="bold" fill="#111827">255 K</tspan><tspan fill="#3f3f46"> &#8212; frozen as the ground truth</tspan></text>
  <text x="72" y="845" font-size="16" fill="#6b7280">one verified solver is released with each problem</text>

  <!-- certified stream into Phase III -->
  <path d="M62,865 L62,1195 L86,1195" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>

  <!-- shared certification invariant -->
  <text x="810" y="955" font-size="17" font-style="italic" fill="#64748b">each model solves independently, never shown the answer&#8217;s value; agreement certifies both the problem text and the answer</text>

  <!-- ===================== PHASE III (left -> right) ===================== -->

  <!-- process: defect audit -->
  <rect x="90" y="1090" width="400" height="210" rx="12" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="112" y="1128" font-size="22" font-weight="bold" fill="#111827">Audit for defects</text>
  <text x="112" y="1155" font-size="16" fill="#6b7280">automated, rule-based checks</text>
  <g font-size="20" fill="#3f3f46">
    <circle cx="122" cy="1185" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="122" y="1190" font-size="13" font-weight="bold" fill="#2a78d6" text-anchor="middle">1</text>
    <text x="142" y="1192">answers hard-coded into the solver</text>
    <circle cx="122" cy="1211" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="122" y="1216" font-size="13" font-weight="bold" fill="#2a78d6" text-anchor="middle">2</text>
    <text x="142" y="1218">duplicate answer keys</text>
    <circle cx="122" cy="1237" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="122" y="1242" font-size="13" font-weight="bold" fill="#2a78d6" text-anchor="middle">3</text>
    <text x="142" y="1244">answer labels that mismatch the question</text>
  </g>

  <!-- arrow audit -> de-scaffold (adjudication step removed) -->
  <line x1="490" y1="1195" x2="676" y2="1195" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>

  <!-- process: de-scaffold (only the two removal passes; solvability gates live in the text) -->
  <rect x="682" y="1090" width="410" height="210" rx="12" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="704" y="1128" font-size="22" font-weight="bold" fill="#111827">De-scaffold</text>
  <text x="704" y="1155" font-size="16" fill="#6b7280">remove knowledge a solver should already have:</text>
  <g font-size="20" fill="#3f3f46">
    <circle cx="714" cy="1185" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="714" y="1190" font-size="13" font-weight="bold" fill="#2a78d6" text-anchor="middle">1</text>
    <text x="734" y="1192">ready-made solving formulas</text>
    <circle cx="714" cy="1211" r="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
    <text x="714" y="1216" font-size="13" font-weight="bold" fill="#2a78d6" text-anchor="middle">2</text>
    <text x="734" y="1218">recallable constants &amp; definitions</text>
  </g>

  <!-- arrow de-scaffold -> final review -->
  <line x1="1092" y1="1195" x2="1279" y2="1195" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>

  <!-- human expert check: final gate (hexagon) -->
  <path d="M1313,1105 L1517,1105 L1545,1195 L1517,1285 L1313,1285 L1285,1195 Z" fill="#faf9f7" stroke="#57534e" stroke-width="2.5"/>
  <g stroke="#57534e" stroke-width="2" fill="none">
    <circle cx="1415" cy="1133" r="7"/>
    <path d="M1402,1154 a13,11 0 0 1 26,0"/>
  </g>
  <text x="1415" y="1200" font-size="21" font-weight="bold" fill="#111827" text-anchor="middle">Final expert review</text>
  <text x="1415" y="1226" font-size="18" fill="#3f3f46" text-anchor="middle">approves every problem</text>
  <text x="1415" y="1249" font-size="18" fill="#3f3f46" text-anchor="middle">before release</text>

  <!-- arrow final check -> released set -->
  <line x1="1545" y1="1195" x2="1579" y2="1195" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>

  <!-- released artifact: 436 core problems -->
  <rect x="1585" y="1120" width="200" height="150" rx="26" fill="#2a78d6"/>
  <text x="1685" y="1185" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">436</text>
  <text x="1685" y="1216" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">confirmed core</text>
  <text x="1685" y="1240" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">problems</text>
  <text x="100" y="1342" font-size="17" font-style="italic" fill="#64748b">problems failing any stage are discarded unless they can be repaired and re-verified</text>
</svg>
