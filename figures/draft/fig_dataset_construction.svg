  <text x="426" y="430" font-size="10" font-weight="bold" fill="#0b0b0b">Numeric variants — contamination probe</text>
  <g font-size="8.5" fill="#52514e">
    <text x="426" y="445">deterministic gates: whitelist &#183; appears in text &#183;</text>
    <text x="426" y="457">output must move &#183; AST faithfulness audit</text>
    <text x="426" y="469">GT: de-rounded full-precision solver twin</text>
    <text x="426" y="481">rewrite: Opus 4.8 &#183; review: GPT-5.5 + Gemini 3.1 Pro</text>
    <text x="426" y="493">(problem unbroken, answer still correct) &#183; fail &#8594; rewrite</text>
  </g>
  <text x="426" y="511" font-size="9.5" font-weight="bold" fill="#0b0b0b">1,730 = 346 parents &#215; 5&#160;&#160;&#183;&#160;&#160;90 core-only (unsafe)</text>

