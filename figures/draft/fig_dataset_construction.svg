  <g font-size="8.5" fill="#52514e">
    <text x="740" y="446">single-trigger edit of one core problem;</text>
    <text x="740" y="458">untouched parent = built-in control &#8594; &#8220;Trap Gap&#8221;</text>
    <text x="740" y="474">gates: unique GT &#183; shortcut vs correct</text>
    <text x="740" y="486">separation &gt; 5% (range 13&#8211;880%, median 65%)</text>
