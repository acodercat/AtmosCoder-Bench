  <text x="180" y="511" font-size="10" font-weight="bold" fill="#0b0b0b">constant demotion</text>
  <text x="180" y="527" font-size="9" fill="#52514e">INPUT_TEXT / INPUT_HIDDEN / CONSTANT</text>
  <text x="180" y="540" font-size="9" fill="#52514e">constants demoted out of signature</text>
  <text x="180" y="553" font-size="8.5" fill="#8a8984">(output proven bit-identical)</text>

