  <!-- ================================================================ -->
  <text x="28" y="42" font-size="16" font-weight="bold" fill="#0b0b0b">a</text>
  <text x="46" y="42" font-size="12.5" font-weight="600" fill="#0b0b0b">Core-set construction</text>

  <!-- row 1 -->
  <g stroke="#c9c8c2" stroke-width="1" fill="#f7f7f5">
    <rect x="40"  y="64" width="140" height="96" rx="6"/>
    <rect x="212" y="64" width="136" height="96" rx="6"/>
    <rect x="380" y="64" width="180" height="96" rx="6"/>
    <rect x="592" y="64" width="192" height="96" rx="6"/>
