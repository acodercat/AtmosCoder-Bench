    <text x="1091" y="541">2</text>
  </g>

  <rect x="728" y="582" width="286" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1"/>
  <text x="740" y="600" font-size="10" font-weight="bold" fill="#0b0b0b">Scaffolding-ablation pairs — 169</text>
  <g font-size="8.5" fill="#52514e">
    <text x="740" y="615">original (with hints) &#8596; stripped = released core</text>
    <text x="740" y="627">same solver &amp; GT — isolates recall effect</text>
    <text x="740" y="643" fill="#8a8984">preserved at de-scaffolding (panel a)</text>
  </g>

  <rect x="1038" y="582" width="162" height="76" rx="6" fill="#ffffff" stroke="#4a3aa7" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1050" y="600" font-size="9.5" font-weight="bold" fill="#0b0b0b">Contradiction family</text>
  <g font-size="8.5" fill="#52514e">
