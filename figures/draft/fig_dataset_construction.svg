  <text x="88" y="516" font-size="10" font-weight="bold" fill="#0b0b0b" text-anchor="middle">436 core</text>
  <text x="88" y="530" font-size="8.5" fill="#52514e" text-anchor="middle">parents</text>

  <rect x="168" y="478" width="204" height="84" rx="6" fill="#f7f7f5" stroke="#c9c8c2"/>
