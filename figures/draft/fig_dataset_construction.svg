  <g font-size="8.5" fill="#52514e">
    <text x="426" y="573">rewrite &#215;5 by Opus 4.8 — values, solver, GT fixed</text>
    <text x="426" y="585">fidelity gate: magnitudes survive &#183; edit-ratio &#8805; &#952;</text>
    <text x="426" y="597">review: GPT-5.5 + Gemini equivalence &#183; fail &#8594; rewrite</text>
  </g>
  <text x="426" y="615" font-size="9.5" font-weight="bold" fill="#0b0b0b">2,180 = 436 parents &#215; 5</text>

  <text x="414" y="652" font-size="8.5" font-weight="bold" fill="#0b0b0b">+ human expert spot-audit of a random sample (both families)</text>

