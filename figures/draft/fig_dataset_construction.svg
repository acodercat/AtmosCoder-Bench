  <rect x="816" y="64" width="384" height="170" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>

  <g font-size="9" fill="#52514e">
    <text x="52" y="84" font-size="10" font-weight="bold" fill="#0b0b0b">13 textbooks</text>
    <text x="52" y="100">undergraduate +</text>
    <text x="52" y="113">graduate level</text>
    <text x="52" y="133" fill="#8a8984">PDF sources</text>

    <text x="224" y="84" font-size="10" font-weight="bold" fill="#0b0b0b">MinerU OCR</text>
    <text x="224" y="100">formula + table</text>
    <text x="224" y="113">recognition</text>
    <text x="224" y="133" fill="#8a8984">&#8594; structured Markdown</text>

    <text x="392" y="82" font-size="10" font-weight="bold" fill="#0b0b0b">Problem extraction</text>
    <text x="392" y="96" font-size="8.5">read page by page, end to end</text>
    <text x="392" y="108" font-size="8.5">+ LLM quality screen: self-contained,</text>
    <text x="392" y="120" font-size="8.5">answerable, OCR-clean &#8594; candidates</text>
    <text x="392" y="136" font-size="8.5" fill="#a04543">drop: derivation-only,</text>
    <text x="392" y="148" font-size="8.5" fill="#a04543">figure- / data-dependent</text>

    <text x="604" y="84" font-size="10" font-weight="bold" fill="#0b0b0b">Blind solve() synthesis</text>
    <text x="604" y="100">given values &#8594; parameters</text>
    <text x="604" y="113">stdlib only &#183; explicit units</text>
    <text x="604" y="126">returns {sub: value, unit}</text>
    <text x="604" y="144" font-style="italic" fill="#8a8984">author never sees the answer</text>
  </g>

  <!-- GT box internals -->
  <text x="828" y="84" font-size="10" font-weight="bold" fill="#0b0b0b">Ground truth — two regimes, cross-vendor</text>
  <rect x="828" y="94" width="360" height="56" rx="4" fill="#ffffff" stroke="#c9c8c2" stroke-width="1"/>
  <g font-size="8.5" fill="#52514e">
    <text x="838" y="108" font-weight="bold" fill="#0b0b0b">Official-answer regime (solutions manual)</text>
    <text x="838" y="121">textbook value reproduced by a blind solver</text>
    <text x="838" y="133">(told units/count only) + second-vendor witness</text>
  </g>
  <rect x="828" y="158" width="360" height="46" rx="4" fill="#ffffff" stroke="#c9c8c2" stroke-width="1"/>
  <g font-size="8.5" fill="#52514e">
    <text x="838" y="172" font-weight="bold" fill="#0b0b0b">Consensus regime (no solutions)</text>
    <text x="838" y="185">author: Claude Opus 4.8 (blind) &#183; witnesses: GPT-5.5,</text>
    <text x="838" y="197">Gemini 3.1 Pro — position-by-position agreement</text>
  </g>
  <g font-size="8.5">
    <text x="828" y="222" font-weight="bold" fill="#0b0b0b">+ human review of every admitted problem (both regimes)</text>
  </g>

  <!-- row-1 arrows -->
  <g stroke="#6b6a66" stroke-width="1.4" fill="none">
