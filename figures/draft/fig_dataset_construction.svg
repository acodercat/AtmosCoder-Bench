  <rect x="902" y="258" width="298" height="88" rx="6" fill="#2a78d6" stroke="#1c5cab" stroke-width="1.2"/>

  <g font-size="9" fill="#52514e">
    <text x="52" y="278" font-size="10" font-weight="bold" fill="#0b0b0b">Defect audit &amp; curation</text>
    <text x="52" y="293">deterministic structural checks</text>
    <text x="52" y="305">+ 3-model well-posedness consensus</text>
    <text x="52" y="317" font-weight="bold" fill="#0b0b0b">+ expert manual review of every flag</text>
    <text x="52" y="333" fill="#a04543">repair &#8594; re-verify &#183; irreparable &#8594; removed</text>

    <text x="336" y="278" font-size="10" font-weight="bold" fill="#0b0b0b">De-scaffolding (difficulty calibration)</text>
    <text x="336" y="294">pass 1: handed-over formulas &#183; pass 2: constants</text>
    <text x="336" y="307">triple gate: blind recovery + audit +</text>
    <text x="336" y="319">cross-vendor reproduction</text>
    <text x="336" y="337" fill="#4a3aa7">169 pre-strip pairs preserved &#8594; panel c</text>

    <text x="650" y="278" font-size="10" font-weight="bold" fill="#0b0b0b">Annotation (not gating)</text>
    <text x="650" y="294">10-class category &#183; two-vendor consensus</text>
    <text x="650" y="307">difficulty rubric (reasoning model):</text>
    <text x="650" y="320">44 low &#183; 258 medium &#183; 134 high</text>
  </g>
  <text x="918" y="296" font-size="26" font-weight="bold" fill="#ffffff">436</text>
  <text x="982" y="296" font-size="11" font-weight="bold" fill="#ffffff">confirmed core problems</text>
  <text x="918" y="318" font-size="8.5" fill="#dce9fb">298 single-part &#183; 138 multi-part (&#8804;14 subs)</text>
  <text x="918" y="331" font-size="8.5" fill="#dce9fb">724 graded sub-answers &#183; model sees text only</text>

