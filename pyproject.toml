readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.97.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "mineru>=2.7.6",
    "numpy>=2.4.3",
    "openai>=2.29.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "requests>=2.32.5",
    "tabulate>=0.10.0",
    "tiktoken>=0.13.0",
]
